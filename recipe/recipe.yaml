schema_version: 1

context:
  version: "0.10.5"

package:
  name: aws-c-auth
  version: ${{ version }}

source:
  url: https://github.com/awslabs/aws-c-auth/archive/v${{ version }}.tar.gz
  sha256: 1ddd1dc476debdbf9ff083e254396fdc3ea0846dccf7d5f983a6571303abcb35

build:
  number: 1

requirements:
  build:
    - cmake
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ninja
  host:
    - aws-c-cal
    - aws-c-common
    - aws-c-http
    - aws-c-io
    - aws-c-sdkutils
  run_exports:
    - ${{ pin_subpackage("aws-c-auth", upper_bound="x.x.x") }}

tests:
  - script:
      - if: unix
        then:
          - test -f $PREFIX/lib/libaws-c-auth${SHLIB_EXT}
          - test -f $PREFIX/include/aws/auth/auth.h
      - if: win
        then:
          - if not exist %LIBRARY_INC%\\aws\\auth\\auth.h exit 1
          - if not exist %PREFIX%\\Library\\bin\\aws-c-auth.dll exit 1
  - if: win and arm64
    then:
      requirements:
        run:
          - ${{ compiler('c') }}
          - cmake
      files:
        recipe:
          - CMakeLists.txt
          - consumer.c
      script:
        - cmake -S . -B consumer-build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%LIBRARY_PREFIX%"
        - cmake --build consumer-build
        - consumer-build\auth_consumer.exe
        - dumpbin /headers "%LIBRARY_BIN%\aws-c-auth.dll" | findstr /I /C:"AA64 machine (ARM64)"
        - dumpbin /headers consumer-build\auth_consumer.exe | findstr /I /C:"AA64 machine (ARM64)"
about:
  homepage: https://github.com/awslabs/aws-c-io
  repository: https://github.com/awslabs/aws-c-io
  license: Apache-2.0
  license_file: LICENSE
  summary: 'C99 library implementation of AWS client-side authentication: standard credentials providers and signing.'

extra:
  feedstock-name: aws-c-auth
  recipe-maintainers:
    - tkelman
    - xhochy
    - conda-forge/aws-sdk-cpp
